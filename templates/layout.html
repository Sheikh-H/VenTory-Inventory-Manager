<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VenTory | {{title or "Stock Management System"}}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Varela+Round&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css')}}"
    />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='media/favicon.ico')}}"
      type="image/x-icon"
    />
    <script src="{{url_for('static', filename='js/script.js')}}" defer></script>
  </head>
  <body>
    <header>{% include 'pages/header-footer/header.html' %}</header>
    <main>{% block content %} {% endblock content %}</main>
    <footer>{% include 'pages/header-footer/footer.html' %}</footer>
  </body>
