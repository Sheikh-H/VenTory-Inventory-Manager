{% extends 'layout.html' %} {% block content %}
<div class="space"></div>
<section class="employee-log-intro">
  <h1>All activity for your business</h1>
  <p>Here you'll find all the activities done by this business.</p>
</section>
<section class="log-section">
  <form action="{{url_for('business_logs')}}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <input type="date" name="date" id="date" max="{{now}}" required />
    <input type="submit" value="Search by date" />
  </form>
  <div class="logs">
    {% for log in logs %}
    <div class="log">
      <div class="log-timestamp">
        <p>{{log.timestamp[0:10]}}</p>
        <p>{{log.timestamp[10:]}}</p>
      </div>
      <p>{{log.comment.title()}}</p>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock content %}
