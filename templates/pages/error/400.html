{% extends 'layout.html' %} {% block content %}
<section id="error-section" class="error-section">
  <h2>400 - Unable to process request!</h2>
  {% if reason %}
  <p>{{ reason }}</p>
  {% else %}
  <p>Your session may be expired, please login to try again.</p>
  {% endif %}
  <a href="{{url_for('home_page')}}">Return Home</a>
</section>
{% endblock content %}
